[ABOUT]
NAME = Drift Setup Assistant
AUTHOR = Quinn Lutters
VERSION = 0.1.0
DESCRIPTION = Tunes your car for drifting one change at a time, and explains every change.
; SPIKE: confirm the minimum CSP build (open question in the brief). Keep in sync with src/game/compat.lua.
REQUIRED_VERSION = 2651

[CORE]
; Load with the session (not when a window is first opened) so runs are recorded
; even while the main window is closed.
LAZY = NONE

[WINDOW_...]
ID = main
NAME = Drift Setup Assistant
ICON = icon.png
FUNCTION_MAIN = windowMain
FUNCTION_SETTINGS = windowSettings
SIZE = 460, 640
MIN_SIZE = 380, 300

[WINDOW_...]
ID = hud
NAME = Drift Setup Assistant HUD
ICON = icon.png
FUNCTION_MAIN = windowHud
SIZE = 220, 80
FLAGS = NO_BACKGROUND, NO_TITLE_BAR
